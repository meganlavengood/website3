<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/reveal.js/dist/reveal.css" />
  <!-- <link rel="stylesheet" href="https://unpkg.com/reveal.js/dist/theme/solarized.css" /> -->
  <link rel="stylesheet" href="../styles/solarized-custom.css">
  <link rel="icon" type="image/x-icon" href="/docs/ml-icon.png">
  <title>TEMPLATE_TITLE</title>
  <meta name="citation_title" content="TEMPLATE_TITLE">
  <meta name="citation_author" content="Lavengood, Megan L.">
  <meta name="citation_conference_title" content="TEMPLATE_CONF">
  <meta name="citation_abstract" content="TEMPLATE_ABSTRACT">
  <meta name="citation_date" content="TEMPLATE_DATE">
</head>

<body>
  <div class="reveal">
    <div class="slides">
      <section data-markdown="slides.md" data-separator="^\n---\n" data-separator-vertical="^\n--\n" data-separator-notes="^Note:">
      </section>
    </div>
  </div>
  <script src="https://unpkg.com/reveal.js/dist/reveal.js"></script>
  <script src="https://unpkg.com/reveal.js/dist/plugin/markdown.js"></script>
  <script src="https://unpkg.com/reveal.js/dist/plugin/notes.js"></script>
  <script>
    const isMobile = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
    Reveal.initialize({
      plugins: [RevealMarkdown, RevealNotes],
      slideNumber: true,
      hash: true, // add slide number to URL
      width: 1040, // 960 default
      transition: isMobile ? 'fade' : 'slide',
      autoAnimateUnmatched: false,
    });
    Reveal.on('ready', () => {
      if (!isMobile) {
        document.querySelectorAll('.reveal .slides section').forEach(section => {
          if (section.querySelector('h1, h2, h3, h4, h5, h6')) {
            section.setAttribute('data-auto-animate', '');
          }
        });
      }
    });
  </script>
</body>

</html>
