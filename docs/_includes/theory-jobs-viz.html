<p class="text-body-secondary fst-italic small">Data taken from the Music Studies Jobs Wiki.</p>

<h2>Jobs available</h2>
<div class="row g-3 justify-content-center mb-4 lead" id="jobs-intro">
    <!-- JS inject number of jobs this year -->
</div>
<div class="row g-3" id="jobs-charts-grid">
</div>

<h2>Who was hired</h2>
<div class="row g-3 justify-content-center mb-4 lead" id="hirees-intro"></div>
<div class="row g-3" id="hirees-charts-grid">
    <!-- JS insert charts here -->
</div>

<h2 id="data">Data</h2>

<p>This table is wide—scroll horizontally to view more data.</p>

<div class="table-responsive">

    <table class=" table text-xs table-sm table-hover mb-0 align-middle sticky-first-col" id="mainTable">
        <thead>
            <tr>
                <th scope="col">Job Institution</th>
                <th scope="col">Job Location</th>
                <th scope="col">Job Title</th>
                <th scope="col">Job Type</th>
                <th scope="col">Status</th>
                <th scope="col">Hiree</th>
                <th scope="col">Hiree Degree Institution</th>
                <th scope="col">Hiree Degree</th>
                <th scope="col">Hiree Concentration</th>
                <th scope="col">Hiree Degree Year</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<link rel="stylesheet" href="/css/jobs.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
